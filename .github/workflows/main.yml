name: Update and deploy Football Hub

on:
  push:
    branches:
      - main

    paths-ignore:
      - "data/videos.json"

  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: football-hub-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp

      - name: Show yt-dlp version
        run: |
          yt-dlp --version

      - name: Update repository before collection
        run: |
          set -e

          git fetch origin main

          git reset --hard origin/main

          echo "Repository synchronized with origin/main."

      - name: Collect and classify football summaries
        run: |
          set -e

          python collector/collect.py

      - name: Commit updated data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/videos.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update football videos"

            git fetch origin main

            # On repart de la branche distante si une modification
            # est arrivée pendant la collecte.
            git rebase origin/main

            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages site
        run: |
          set -e

          mkdir -p site/data
          cp data/videos.json site/data/videos.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
